version: 2

models:
  - name: stg_players
    description: "Cleaned and standardized player statistics from RAW layer"
    columns:
      - name: player_id
        description: "Unique player identifier from API-Football"
        tests:
          - not_null
      - name: team_id
        description: "Team identifier"
        tests:
          - not_null
      - name: league_id
        description: "League identifier"
        tests:
          - not_null
          - accepted_values:
              values: [39, 140]
      - name: snapshot_date
        description: "Date of the snapshot"
        tests:
          - not_null
      - name: goals
        description: "Total goals scored"
        tests:
          - not_null
      - name: appearances
        description: "Total appearances"
        tests:
          - not_null

  - name: stg_standings
    description: "Cleaned and standardized league standings from RAW layer"
    columns:
      - name: team_id
        description: "Unique team identifier"
        tests:
          - not_null
      - name: league_id
        description: "League identifier"
        tests:
          - not_null
          - accepted_values:
              values: [39, 140]
      - name: snapshot_date
        description: "Date of the snapshot"
        tests:
          - not_null
      - name: points
        description: "Total points"
        tests:
          - not_null
      - name: rank
        description: "Team rank in the league"
        tests:
          - not_null
